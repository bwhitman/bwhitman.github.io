<div class="masthead-container">
    <header role="banner">
        <p><strong>{{ site.title }}</strong> <br> {{ site.tagline }}</p>
        {% include navigation.html %}
    </header>
    <div><p><i>I can send you a brief mail whenever I post. Enter your address if you'd like that.</i></p></div>
    <form id="subForm" action="https://eocampaign1.com/form/dd3388a2-81e0-11f1-b500-85e0ac89c752" method="post"><label>Email </label><input autocomplete="email" aria-label="Email" id="fieldEmail" maxlength="200" name="field_0" required="" type="email"><button type="submit">Subscribe</button><span aria-hidden="true" style="position:absolute; left:-5000px;"><input type="text" name="hpc4b27b6e-eb38-11e9-be00-06b4694bee2a" tabindex="-1" autocomplete="nope"></span></form>
    <p id="subFormMsg" style="display:none;"></p>
    <script>
    (function () {
      var form = document.getElementById('subForm');
      var msg = document.getElementById('subFormMsg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var button = form.querySelector('[type=submit]');
        button.disabled = true;
        fetch(form.action, { method: 'POST', body: new FormData(form) })
          .then(function (r) { return r.json(); })
          .then(function (response) {
            if (!response.success) {
              throw (response.error && response.error.message) || 'error';
            }
            form.style.display = 'none';
            msg.textContent = 'Thanks for subscribing!';
            msg.style.display = 'block';
          })
          .catch(function (err) {
            msg.textContent = typeof err === 'string' && err !== 'error' ? err : 'Sorry, something went wrong. Please try again later.';
            msg.style.display = 'block';
            button.disabled = false;
          });
      });
    })();
    </script>
    <div>
        <p>
        </p>
    </div>

</div>
